<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>龍廟 · Dragon Temple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #2d0f0f;
      --bg-panel: #3d1a1a;
      --gold: #d4a843;
      --gold-light: #f0d68a;
      --red-accent: #c53a2c;
      --text-light: #fef3e0;
      --text-dim: #bca78d;
      --font-display: 'Ma Shan Zheng', 'Noto Serif SC', serif;
      --font-body: 'Noto Serif SC', serif;
      --safe-inset-bottom: env(safe-area-inset-bottom, 10px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: calc(80px + var(--safe-inset-bottom));
      background: radial-gradient(ellipse at 50% 20%, #4a1e1e 0%, #1f0a0a 70%);
      position: relative;
      overflow: hidden;
    }
    .bg-dragon, .bg-cloud {
      position: absolute;
      font-size: 120px;
      opacity: 0.06;
      color: var(--gold);
      pointer-events: none;
    }
    .bg-dragon { top: 10px; left: -20px; }
    .bg-cloud { bottom: 40px; right: -30px; font-size: 100px; color: var(--gold-light); opacity: 0.05; }
    .header {
      text-align: center;
      z-index: 2;
      margin-bottom: 10px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 2.6em;
      color: var(--gold);
      text-shadow: 0 0 20px #d4a84366;
      letter-spacing: 2px;
    }
    .header .subtitle {
      font-size: 0.9em;
      color: var(--text-dim);
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
      z-index: 2;
    }
    .tab-btn {
      background: #3b1515;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 1.2em;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #1f0a0a;
      box-shadow: 0 0 15px #d4a843aa;
    }
    .tab-content {
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      flex: 1;
    }
    .tab-content.active { display: flex; }
    .altar-area {
      position: relative;
      margin: 20px 0;
    }
    .incense-bowl {
      font-size: 80px;
      filter: drop-shadow(0 0 10px #d4a843);
      text-align: center;
    }
    .smoke-container {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 150px;
      pointer-events: none;
    }
    .smoke {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 12px;
      height: 0;
      background: linear-gradient(to top, #d4a843, transparent);
      border-radius: 50%;
      animation: rise 3s infinite;
      opacity: 0.4;
    }
    .smoke:nth-child(2) { left: 40%; animation-delay: 0.4s; }
    .smoke:nth-child(3) { left: 60%; animation-delay: 0.8s; }
    .smoke.premium {
      background: linear-gradient(to top, #f0d68a, #d4a843, transparent);
      opacity: 0.7;
    }
    @keyframes rise {
      0% { height: 0; opacity: 0.8; transform: translateY(0) scaleX(1); }
      50% { height: 40px; opacity: 0.6; transform: translateY(-20px) scaleX(1.5); }
      100% { height: 80px; opacity: 0; transform: translateY(-50px) scaleX(2); }
    }
    .count-badge {
      background: #451212;
      border: 1px solid var(--gold);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8em;
      margin: 10px 0;
      color: var(--gold-light);
    }
    .action-btn {
      background: linear-gradient(180deg, #d4a843 0%, #b8832a 100%);
      border: none;
      color: #1f0a0a;
      font-family: var(--font-display);
      font-size: 1.2em;
      padding: 12px 30px;
      border-radius: 40px;
      cursor: pointer;
      width: 80%;
      max-width: 280px;
      margin: 8px 0;
      box-shadow: 0 6px 0 #7a4a1a, 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.1s, opacity 0.3s;
      position: relative;
      text-align: center;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #7a4a1a, 0 4px 10px rgba(0,0,0,0.3);
    }
    .action-btn.secondary {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      box-shadow: none;
    }
    .action-btn:disabled {
      opacity: 0.6;
      pointer-events: none;
    }
    .oracle-card {
      background: #2f1515;
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      text-align: center;
      margin: 10px 0;
    }
    .star-sign {
      font-size: 2em;
      font-family: var(--font-display);
      color: var(--gold);
    }
    .prediction-text {
      font-size: 1em;
      color: var(--text-dim);
      margin: 10px 0;
      white-space: pre-line;
    }
    .adsgram-banner {
      width: 100%;
      height: 60px;
      background: #1f0a0a;
      border: 1px dashed var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.8em;
      z-index: 3;
      margin-top: auto;
    }
    #birthInput {
      padding: 8px;
      border-radius: 10px;
      background: #2f1515;
      border: 1px solid var(--gold);
      color: var(--text-light);
    }
    .save-birth-btn {
      background: var(--gold);
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-family: var(--font-display);
      cursor: pointer;
    }
    .footer-note {
      color: var(--text-dim);
      font-size: 0.7em;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="bg-dragon">🐉</div>
  <div class="bg-cloud">☁️</div>

  <div class="header">
    <h1>龍廟</h1>
    <p class="subtitle">Dragon Temple · 每日靈驗</p>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="incense" onclick="switchTab('incense')">🪔 香火</button>
    <button class="tab-btn" data-tab="oracle" onclick="switchTab('oracle')">🔮 神諭</button>
  </div>

  <!-- Вкладка Благовония -->
  <div id="tab-incense" class="tab-content active">
    <div class="altar-area">
      <div class="incense-bowl" id="incenseBowl">🪔</div>
      <div class="smoke-container" id="smokeContainer">
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
      </div>
    </div>
    <div class="count-badge" id="todayCount">🔥 今日功德: 計算中...</div>
    <button class="action-btn" id="btnFreeIncense" onclick="lightFreeIncense()">🙏 免費清香</button>
    <button class="action-btn" id="btnSandalwood" onclick="buyIncense('sandalwood', 9)">🌿 檀香 (9⭐)</button>
    <button class="action-btn" id="btnLotus" onclick="buyIncense('lotus', 19)">🪷 蓮花香 (19⭐)</button>
    <button class="action-btn secondary" id="btnWeek" onclick="buyIncense('week', 49)">📿 七日功德套裝 (49⭐)</button>
    <p id="incenseMsg" style="margin-top:10px; color:var(--gold-light); min-height: 24px;"></p>
  </div>

  <!-- Вкладка Оракул -->
  <div id="tab-oracle" class="tab-content">
    <div class="oracle-card" id="oracleCard">
      <div class="star-sign" id="starSign">🐉</div>
      <p id="shortPrediction">點擊下方按鈕獲取今日神諭</p>
      <div id="fullPrediction" style="display:none;">
        <hr style="border-color: var(--gold); margin: 15px 0;">
        <p class="prediction-text" id="detailedText"></p>
        <p style="font-size:0.8em; color:var(--gold);">✨ 龍神護體 ✨</p>
      </div>
    </div>
    <button class="action-btn" id="btnFreeOracle" onclick="getFreeOracle()">🔮 免費神諭</button>
    <button class="action-btn" id="btnDetailedOracle" onclick="buyDetailedOracle(15)">📜 詳細命理 (15⭐)</button>
    <p id="oracleMsg" style="margin-top:10px; min-height: 24px;"></p>
    <div style="margin:10px 0; display:flex; gap:10px; align-items:center; width:100%; justify-content:center;">
      <label style="color:var(--text-dim);">生日</label>
      <input type="date" id="birthInput" style="flex:1; max-width:180px;">
      <button class="save-birth-btn" onclick="saveBirth()">保存</button>
    </div>
    <p id="birthMsg" style="font-size:0.8em; color:var(--gold-light);"></p>
  </div>

  <!-- Рекламный блок Adsgram -->
  <div class="adsgram-banner" id="adsgramBlock">此處為廣告區域</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // ======================== НАСТРОЙКИ ========================
  const ADSGRAM_BLOCK_ID = 'YOUR_ADSGRAM_BLOCK_ID'; // ← замените на ваш ID

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // ===================== ОБЛАЧНОЕ ХРАНИЛИЩЕ =================
  const cloud = {
    async get(key) {
      if (tg.CloudStorage) {
        try {
          const val = await tg.CloudStorage.getItem(key);
          if (val !== null && val !== undefined) return val;
        } catch (e) {}
      }
      return localStorage.getItem(key);
    },
    async set(key, value) {
      if (tg.CloudStorage) {
        try { await tg.CloudStorage.setItem(key, value); } catch (e) {}
      }
      try { localStorage.setItem(key, value); } catch (e) {}
    }
  };

  // ===================== СОСТОЯНИЕ ПОЛЬЗОВАТЕЛЯ ==============
  let userState = {
    incenseCount: 0,
    lastFreeIncense: '',
    birthDate: ''
  };

  // ===================== БАЗА ПРЕДСКАЗАНИЙ ===================
  const predictionsDB = [
    { star: '青龍', sign: '🐉', short: '大吉大利', full: '青龍現世，萬象更新。事業如朝陽升起，財運亨通。宜著綠衣，往東方行。' },
    { star: '白虎', sign: '🐅', short: '謹慎行事', full: '白虎臨門，防小人暗算。不宜簽約投資，忍一時風平浪靜。' },
    { star: '朱雀', sign: '🦅', short: '喜事臨門', full: '朱雀報喜，桃花盛開。單身者遇良緣，已婚者和睦。但勿洩漏他人私隱。' },
    { star: '玄武', sign: '🐢', short: '穩中求勝', full: '玄武主穩，適合靜心學習與規劃。財運平穩，無大波瀾。' },
    { star: '天罡', sign: '⭐', short: '挑戰降臨', full: '天罡星動，或有突如其來之挑戰。午後得貴人相助，化險為夷。' },
    { star: '地煞', sign: '🌑', short: '阻滯難行', full: '地煞當道，事事拖延。宜祭祀祈福，不宜遠行。' },
    { star: '金匱', sign: '💰', short: '財星高照', full: '金匱入命，偏財旺盛。彩票小試手氣或有好運，但勿貪心。' },
    { star: '天喜', sign: '🎉', short: '佳期將至', full: '天喜降臨，適合訂婚、求婚、慶祝。心情愉悅，萬事順遂。' },
    { star: '病符', sign: '🤒', short: '注意健康', full: '病符星現，身體易感疲憊。早睡養肝，飲食清淡可保平安。' },
    { star: '驛馬', sign: '🐎', short: '奔波勞碌', full: '驛馬星動，出差或搬家可能性大。宜動不宜靜，旅途見機遇。' },
    { star: '官符', sign: '⚖️', short: '口舌官非', full: '官符纏身，注意法律文書。行車謹慎防罰單，處世低調免糾紛。' },
    { star: '六合', sign: '🤝', short: '合作共贏', full: '六合星助，人際關係和諧。談判順利，合作事宜可積極推進。' }
  ];

  // ===================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash |= 0;
    }
    return Math.abs(hash);
  }

  // ===================== ИНИЦИАЛИЗАЦИЯ СОСТОЯНИЯ ============
  async function loadState() {
    const json = await cloud.get('dragon_state');
    if (json) {
      try { userState = JSON.parse(json); } catch(e) {}
    }
    document.getElementById('todayCount').innerText = `🔥 今日功德: ${userState.incenseCount || 0}`;
    if (userState.birthDate) {
      document.getElementById('birthInput').value = userState.birthDate;
    }
    // Показать бесплатный оракул при загрузке
    getFreeOracle();
  }

  async function saveState() {
    await cloud.set('dragon_state', JSON.stringify(userState));
  }

  // ===================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ===============
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (activeBtn) activeBtn.classList.add('active');
  }

  // ===================== АНИМАЦИЯ ДЫМА ======================
  function animateSmoke(premium) {
    const container = document.getElementById('smokeContainer');
    // Пересоздаём элементы для чистого перезапуска
    container.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const smoke = document.createElement('div');
      smoke.className = 'smoke' + (premium ? ' premium' : '');
      container.appendChild(smoke);
    }
  }

  // ===================== ПЛАТЕЖИ: ОБРАБОТЧИК ================
  function setupPayments() {
    tg.onEvent('invoiceClosed', async (data) => {
      if (!data || data.status !== 'paid') return;

      const payload = data.payload;
      if (!payload) return;

      if (payload.startsWith('incense_')) {
        const parts = payload.split('_'); // ['incense', type, timestamp]
        const type = parts[1];
        const increment = type === 'week' ? 7 : 1;
        userState.incenseCount = (userState.incenseCount || 0) + increment;
        await saveState();
        document.getElementById('todayCount').innerText = `🔥 今日功德: ${userState.incenseCount}`;
        document.getElementById('incenseMsg').innerText = '功德圓滿！';
        animateSmoke(true);
      }
      else if (payload.startsWith('oracle_')) {
        // Детальный гороскоп оплачен – генерируем и показываем
        const today = new Date().toDateString();
        const seed = hashCode(today + (userState.birthDate || '') + 'detailed');
        const pred = predictionsDB[seed % predictionsDB.length];
        document.getElementById('starSign').innerText = pred.sign + ' ' + pred.star;
        document.getElementById('shortPrediction').innerText = pred.short;
        document.getElementById('detailedText').innerText = pred.full;
        document.getElementById('fullPrediction').style.display = 'block';
        document.getElementById('oracleMsg').innerText = '✨ 解鎖成功！';
      }

      // Разблокируем кнопки
      enableButtons(true);
    });
  }

  function enableButtons(enable) {
    const btns = document.querySelectorAll('.action-btn');
    btns.forEach(b => { if (enable) b.removeAttribute('disabled'); else b.setAttribute('disabled', 'disabled'); });
  }

  // ===================== МЕХАНИКИ БЛАГОВОНИЙ ================
  async function lightFreeIncense() {
    const today = new Date().toDateString();
    if (userState.lastFreeIncense === today) {
      document.getElementById('incenseMsg').innerText = '今日已領取免費清香，明日再來。';
      return;
    }
    enableButtons(false);
    userState.lastFreeIncense = today;
    userState.incenseCount = (userState.incenseCount || 0) + 1;
    await saveState();
    animateSmoke(false);
    document.getElementById('todayCount').innerText = `🔥 今日功德: ${userState.incenseCount}`;
    document.getElementById('incenseMsg').innerText = '清香一炷，龍神護佑。';
    enableButtons(true);

    // Предложение перейти к оракулу
    setTimeout(() => {
      if (confirm('神靈已感應你的誠心。是否查看今日神諭？')) {
        switchTab('oracle');
      }
    }, 800);
  }

  function buyIncense(type, stars) {
    enableButtons(false);
    const titles = { sandalwood: '檀香', lotus: '蓮花香', week: '七日功德套裝' };
    const descs = { sandalwood: '高級檀香，24小時祈福', lotus: '蓮花香，招財進寶', week: '連續七天自動祈福' };
    const payload = `incense_${type}_${Date.now()}`;
    openInvoice(titles[type], descs[type], payload, stars);
  }

  // ===================== МЕХАНИКИ ОРАКУЛА ===================
  function getFreeOracle() {
    const today = new Date().toDateString();
    const seed = hashCode(today + (userState.birthDate || ''));
    const pred = predictionsDB[seed % predictionsDB.length];
    document.getElementById('starSign').innerText = pred.sign + ' ' + pred.star;
    document.getElementById('shortPrediction').innerText = pred.short;
    document.getElementById('fullPrediction').style.display = 'none';
    document.getElementById('oracleMsg').innerText = '';
  }

  function buyDetailedOracle(stars) {
    enableButtons(false);
    const payload = `oracle_${Date.now()}`;
    openInvoice('詳細命理', '獲得四柱詳解與開運秘法', payload, stars);
  }

  // Обёртка для открытия счёта
  function openInvoice(title, description, payload, stars) {
    tg.openInvoice({
      title: title,
      description: description,
      payload: payload,
      currency: 'XTR',
      prices: [{ label: title, amount: stars * 1 }]
    });
  }

  // ===================== ДАТА РОЖДЕНИЯ =======================
  async function saveBirth() {
    const input = document.getElementById('birthInput');
    const val = input.value;
    if (!val) {
      document.getElementById('birthMsg').innerText = '請選擇日期';
      return;
    }
    userState.birthDate = val;
    await saveState();
    document.getElementById('birthMsg').innerText = '生日已保存，神諭將更準確。';
    getFreeOracle(); // обновим предсказание с учётом даты
  }

  // ===================== ADSGRAM =============================
  function initAdsgram() {
    if (ADSGRAM_BLOCK_ID !== 'YOUR_ADSGRAM_BLOCK_ID') {
      const script = document.createElement('script');
      script.src = 'https://app.adsgram.ai/js/sdk.js';
      script.onload = () => {
        const container = document.getElementById('adsgramBlock');
        container.innerHTML = '';
        const adDiv = document.createElement('div');
        adDiv.id = 'adsgram-' + ADSGRAM_BLOCK_ID;
        container.appendChild(adDiv);
        new window.Adsgram({ blockId: ADSGRAM_BLOCK_ID }).show();
      };
      document.body.appendChild(script);
    }
  }

  // ===================== СТАРТ ===============================
  setupPayments();
  loadState().then(() => {
    initAdsgram();
    // Если сегодня ещё не зажигали бесплатное, напомнить
    if (!userState.lastFreeIncense || userState.lastFreeIncense !== new Date().toDateString()) {
      setTimeout(() => {
        document.getElementById('incenseMsg').innerText = '新的一天，點一炷清香吧。';
      }, 500);
    }
  });
</script>
</body>
</html>
