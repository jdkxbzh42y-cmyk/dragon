<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>命运引擎 · Fate Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a0a0a;
      --bg-panel: #2e1212;
      --gold: #d4a843;
      --gold-light: #f0d68a;
      --text-light: #fef3e0;
      --text-dim: #bca78d;
      --font-display: 'Ma Shan Zheng', 'Noto Serif SC', serif;
      --font-body: 'Noto Serif SC', serif;
      --safe-inset-bottom: env(safe-area-inset-bottom, 10px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: calc(80px + var(--safe-inset-bottom));
      background: radial-gradient(ellipse at 50% 20%, #3b1515 0%, #1a0a0a 70%);
      position: relative;
      overflow: hidden;
    }
    .bg-dragon, .bg-cloud {
      position: absolute;
      font-size: 120px;
      opacity: 0.05;
      color: var(--gold);
      pointer-events: none;
    }
    .bg-dragon { top: 10px; left: -20px; }
    .bg-cloud { bottom: 40px; right: -30px; font-size: 100px; color: var(--gold-light); opacity: 0.04; }
    .header {
      text-align: center;
      z-index: 2;
      margin-bottom: 10px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 2.4em;
      color: var(--gold);
      text-shadow: 0 0 20px #d4a84366;
      letter-spacing: 2px;
    }
    .header .subtitle {
      font-size: 0.9em;
      color: var(--text-dim);
    }
    .lang-switch {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 0.8em;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 5;
    }
    .karma-badge {
      background: #2f1515;
      border: 1px solid var(--gold);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8em;
      margin: 8px auto;
      display: inline-block;
      color: var(--gold-light);
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
      z-index: 2;
    }
    .tab-btn {
      background: #3b1515;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 1.2em;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #1f0a0a;
      box-shadow: 0 0 15px #d4a843aa;
    }
    .tab-content {
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      flex: 1;
    }
    .tab-content.active { display: flex; }
    .altar-area {
      position: relative;
      margin: 20px 0;
    }
    .incense-bowl {
      font-size: 80px;
      filter: drop-shadow(0 0 10px #d4a843);
      text-align: center;
    }
    .smoke-container {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 150px;
      pointer-events: none;
    }
    .smoke {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 12px;
      height: 0;
      background: linear-gradient(to top, #d4a843, transparent);
      border-radius: 50%;
      animation: rise 3s infinite;
      opacity: 0.4;
    }
    .smoke:nth-child(2) { left: 40%; animation-delay: 0.4s; }
    .smoke:nth-child(3) { left: 60%; animation-delay: 0.8s; }
    .smoke.premium {
      background: linear-gradient(to top, #f0d68a, #d4a843, transparent);
      opacity: 0.7;
    }
    @keyframes rise {
      0% { height: 0; opacity: 0.8; transform: translateY(0) scaleX(1); }
      50% { height: 40px; opacity: 0.6; transform: translateY(-20px) scaleX(1.5); }
      100% { height: 80px; opacity: 0; transform: translateY(-50px) scaleX(2); }
    }
    .action-btn {
      background: linear-gradient(180deg, #d4a843 0%, #b8832a 100%);
      border: none;
      color: #1f0a0a;
      font-family: var(--font-display);
      font-size: 1.2em;
      padding: 12px 30px;
      border-radius: 40px;
      cursor: pointer;
      width: 80%;
      max-width: 280px;
      margin: 8px 0;
      box-shadow: 0 6px 0 #7a4a1a, 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.1s;
      text-align: center;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #7a4a1a, 0 4px 10px rgba(0,0,0,0.3);
    }
    .action-btn.secondary {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      box-shadow: none;
    }
    .action-btn:disabled { opacity: 0.6; pointer-events: none; }
    .oracle-card {
      background: #2f1515;
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      text-align: center;
      margin: 10px 0;
    }
    .star-sign {
      font-size: 2em;
      font-family: var(--font-display);
      color: var(--gold);
    }
    .prediction-text {
      font-size: 1em;
      color: var(--text-dim);
      margin: 10px 0;
      white-space: pre-line;
    }
    .adsgram-banner {
      width: 100%;
      height: 60px;
      background: #1f0a0a;
      border: 1px dashed var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.8em;
      z-index: 3;
      margin-top: auto;
    }
    .footer-note { color: var(--text-dim); font-size: 0.7em; text-align: center; margin-top: 8px; }
    #birthInput {
      padding: 8px;
      border-radius: 10px;
      background: #2f1515;
      border: 1px solid var(--gold);
      color: var(--text-light);
    }
    .save-birth-btn {
      background: var(--gold);
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-family: var(--font-display);
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="bg-dragon">🐉</div>
  <div class="bg-cloud">☁️</div>

  <!-- Кнопка переключения языка -->

  <div class="header">

  </div>

  <!-- Карма -->

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="incense" onclick="switchTab('incense')">🪔 <span class="i18n" data-key="tab_incense">香火</span></button>
    <button class="tab-btn" data-tab="oracle" onclick="switchTab('oracle')">🔮 <span class="i18n" data-key="tab_oracle">神諭</span></button>
  </div>

  <!-- Вкладка Благовония -->
  <div id="tab-incense" class="tab-content active">
    <div class="altar-area">
      <div class="incense-bowl" id="incenseBowl">🪔</div>
      <div class="smoke-container" id="smokeContainer">
        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>
      </div>
    </div>
    <div class="count-badge" id="todayCount">🔥 <span class="i18n" data-key="today_merit">今日功德</span>: 0</div>
    <button class="action-btn" id="btnFreeIncense" onclick="lightFreeIncense()">🙏 <span class="i18n" data-key="free_incense">免費清香</span></button>
    <button class="action-btn" id="btnSandalwood" onclick="buyIncense('sandalwood', 9)">🌿 <span class="i18n" data-key="sandalwood">檀香</span> (9⭐)</button>
    <button class="action-btn" id="btnLotus" onclick="buyIncense('lotus', 19)">🪷 <span class="i18n" data-key="lotus">蓮花香</span> (19⭐)</button>
    <button class="action-btn secondary" id="btnWeek" onclick="buyIncense('week', 49)">📿 <span class="i18n" data-key="week_pack">七日功德套裝</span> (49⭐)</button>
    <p id="incenseMsg" style="margin-top:10px; color:var(--gold-light); min-height: 24px;"></p>
  </div>

  <!-- Вкладка Оракул -->
  <div id="tab-oracle" class="tab-content">
    <div class="oracle-card" id="oracleCard">
      <div class="star-sign" id="starSign">🐉</div>
      <p id="shortPrediction"><span class="i18n" data-key="oracle_initial">點擊下方按鈕獲取今日神諭</span></p>
      <div id="fullPrediction" style="display:none;">

        <p class="prediction-text" id="detailedText"></p>
        <p style="font-size:0.8em; color:var(--gold);"><span class="i18n" data-key="dragon_protects">✨ 龍神護體 ✨</span></p>
      </div>
    </div>
    <button class="action-btn" id="btnFreeOracle" onclick="getFreeOracle()">🔮 <span class="i18n" data-key="free_oracle">免費神諭</span></button>
    <button class="action-btn" id="btnDetailedOracle" onclick="buyDetailedOracle(15)">📜 <span class="i18n" data-key="detailed_oracle">詳細命理</span> (15⭐)</button>
    <p id="oracleMsg" style="margin-top:10px; min-height: 24px;"></p>

    </div>
    <p id="birthMsg" style="font-size:0.8em; color:var(--gold-light);"></p>
  </div>

  <div class="adsgram-banner" id="adsgramBlock">此處為廣告區域</div>

  // ===================== ФУНКЦИИ КАРМЫ ========================
  async function processDailyKarma() {
    const today = new Date().toDateString();
    let message = '';
    if (userState.lastLoginDate !== today) {
      // Если это не первый вход и есть предыдущая дата, проверяем пропуск
      if (userState.lastLoginDate) {
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        if (userState.lastLoginDate !== yesterday) {
          userState.karma -= 3;
          message += t('karma_missed') + ' ';
        }
      }
      // Начисляем ежедневный бонус (только один раз в день при первом заходе)
      userState.karma += 1;
      message += t('karma_daily_bonus');
      userState.lastLoginDate = today;
      await saveState();
      if (message) alert(message);
    }
    updateKarmaDisplay();
  }

  function addKarma(amount) {
    userState.karma += amount;
    saveState();
    updateKarmaDisplay();
  }

  function updateKarmaDisplay() {
    const disp = document.getElementById('karmaDisplay');
    if (disp) disp.innerText = `${t('karma_balance')}: ${userState.karma}`;
  }

  // ===================== ВСПОМОГАТЕЛЬНЫЕ =======================
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function updateUI() {
    // Обновить тексты интерфейса
    document.querySelectorAll('.i18n').forEach(el => {
      const key = el.getAttribute('data-key');
      if (key) el.innerText = t(key);
    });
    // обновить карму
    document.getElementById('karmaDisplay').innerText = `${t('karma_balance')}: ${userState.karma}`;
    // обновить счётчик свечей
    document.getElementById('todayCount').innerHTML = `🔥 ${t('today_merit')}: ${userState.incenseCount}`;
    // перерисовать предсказание на текущем языке, если есть
    const short = document.getElementById('shortPrediction');
    if (short && short.innerText !== t('oracle_initial')) {
      // если есть результат, можно обновить на другой язык, но проще перезапустить оракул
      getFreeOracle();
    }
  }

  // ===================== ЗАГРУЗКА СОСТОЯНИЯ ====================
  async function loadState() {
    const json = await cloud.get('fate_state');
    if (json) {
      try { userState = JSON.parse(json); } catch(e) {}
    }
    // если язык не установлен, берём из системы или по умолчанию
    document.getElementById('langSwitch').innerText = t('switch_lang');
    document.title = currentLang === 'zh' ? '命运引擎 · Fate Engine' : 'Fate Engine · 命运引擎';
    if (userState.birthDate) {
      document.getElementById('birthInput').value = userState.birthDate;
    }
    document.getElementById('todayCount').innerHTML = `🔥 ${t('today_merit')}: ${userState.incenseCount}`;
    updateKarmaDisplay();
    processDailyKarma();
    getFreeOracle();
  }

  async function saveState() {
    await cloud.set('fate_state', JSON.stringify(userState));
  }

  // ===================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ================
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (btn) btn.classList.add('active');
  }

  // ===================== АНИМАЦИЯ ДЫМА =======================
  function animateSmoke(premium) {
    const container = document.getElementById('smokeContainer');
    container.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const smoke = document.createElement('div');
      smoke.className = 'smoke' + (premium ? ' premium' : '');
      container.appendChild(smoke);
    }
  }

  // ===================== ПЛАТЕЖИ ==============================
  function setupPayments() {
    tg.onEvent('invoiceClosed', async (data) => {
      if (!data || data.status !== 'paid') return;
      const payload = data.payload || '';
      if (payload.startsWith('incense_')) {
        const parts = payload.split('_');
        const type = parts[1];
        const increment = type === 'week' ? 7 : 1;
        userState.incenseCount += increment;
        addKarma(2); // карма за каждую свечу
        await saveState();
        document.getElementById('todayCount').innerHTML = `🔥 ${t('today_merit')}: ${userState.incenseCount}`;
        document.getElementById('incenseMsg').innerText = t('incense_msg_paid');
        animateSmoke(true);
      } else if (payload.startsWith('oracle_')) {
        const today = new Date().toDateString();
        const seed = hashCode(today + (userState.birthDate || '') + 'detailed');
        const list = predictionsDB[currentLang];
        const pred = list[seed % list.length];
        document.getElementById('starSign').innerText = pred.sign + ' ' + pred.star;
        document.getElementById('shortPrediction').innerText = pred.short;
        document.getElementById('detailedText').innerText = pred.full;
        document.getElementById('fullPrediction').style.display = 'block';
        document.getElementById('oracleMsg').innerText = '✨ ' + t('dragon_protects');
        addKarma(2); // карма за детальное предсказание
      }
      enableButtons(true);
    });
  }

  function enableButtons(enable) {
    const btns = document.querySelectorAll('.action-btn');
    btns.forEach(b => { if (enable) b.removeAttribute('disabled'); else b.setAttribute('disabled', 'disabled'); });
  }

  // ===================== БЛАГОВОНИЯ ===========================
  async function lightFreeIncense() {
    const today = new Date().toDateString();
    if (userState.lastFreeIncense === today) {
      document.getElementById('incenseMsg').innerText = t('incense_msg_free_claimed');
      return;
    }
    userState.lastFreeIncense = today;
    userState.incenseCount++;
    addKarma(1); // +1 за бесплатную свечу
    await saveState();
    animateSmoke(false);
    document.getElementById('todayCount').innerHTML = `🔥 ${t('today_merit')}: ${userState.incenseCount}`;
    document.getElementById('incenseMsg').innerText = t('incense_msg_free_ok');
    setTimeout(() => {
      if (confirm('神靈已感應你的誠心。是否查看今日神諭？')) {
        switchTab('oracle');
      }
    }, 800);
  }

  function buyIncense(type, stars) {
    enableButtons(false);
    const titles = { sandalwood: t('sandalwood'), lotus: t('lotus'), week: t('week_pack') };
    const payload = `incense_${type}_${Date.now()}`;
    tg.openInvoice({
      title: titles[type],
      description: '',
      payload: payload,
      currency: 'XTR',
      prices: [{ label: titles[type], amount: stars }]
    });
  }

  // ===================== ОРАКУЛ ===============================
  function getFreeOracle() {
    const today = new Date().toDateString();
    const seed = hashCode(today + (userState.birthDate || ''));
    const list = predictionsDB[currentLang];
    const pred = list[seed % list.length];
    document.getElementById('starSign').innerText = pred.sign + ' ' + pred.star;
    document.getElementById('shortPrediction').innerText = pred.short;
    document.getElementById('fullPrediction').style.display = 'none';
    document.getElementById('oracleMsg').innerText = '';
  }

  function buyDetailedOracle(stars) {
    enableButtons(false);
    tg.openInvoice({
      title: t('detailed_oracle'),
      description: '',
      payload: `oracle_${Date.now()}`,
      currency: 'XTR',
      prices: [{ label: t('detailed_oracle'), amount: stars }]
    });
  }

  async function saveBirth() {
    const val = document.getElementById('birthInput').value;
    if (!val) {
      document.getElementById('birthMsg').innerText = t('birth_select');
      return;
    }
    userState.birthDate = val;
    await saveState();
    document.getElementById('birthMsg').innerText = t('birth_saved');
    getFreeOracle();
  }

  // ===================== ADSGRAM ==============================
  function initAdsgram() {
    if (ADSGRAM_BLOCK_ID !== 'YOUR_ADSGRAM_BLOCK_ID') {
      const script = document.createElement('script');
      script.src = 'https://app.adsgram.ai/js/sdk.js';
      script.onload = () => {
        const container = document.getElementById('adsgramBlock');
        container.innerHTML = '';
        const adDiv = document.createElement('div');
        adDiv.id = 'adsgram-' + ADSGRAM_BLOCK_ID;
        container.appendChild(adDiv);
        new window.Adsgram({ blockId: ADSGRAM_BLOCK_ID }).show();
      };
      document.body.appendChild(script);
    }
  }

  // ===================== СТАРТ ===============================
  setupPayments();
  loadState().then(() => {
    initAdsgram();
  });
</script>
